name: Build Verification

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Client
        run: |
          cd client
          npm ci
          npm run build

      - name: Build Worker
        run: |
          cd worker
          npm ci
          npm run build
